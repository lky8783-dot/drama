<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드라마 시청률 순위 TOP10 — 이번주 드라마·예능 시청률 실시간</title>
<meta name="description" content="이번 주 드라마·예능 시청률 순위 TOP10. 월화·수목·금토·주말 드라마 시청률, 출연진·줄거리 포함. 매일 자동 업데이트.">
<meta name="keywords" content="드라마시청률,이번주드라마순위,주간드라마시청률,예능시청률,드라마순위TOP10,월화드라마,금토드라마,주말드라마,시청률순위,드라마추천">
<style>
  :root {
    --bg:     #0d1117;
    --card:   #161b22;
    --border: #21262d;
    --text:   #e6edf3;
    --sub:    #8b949e;
    --muted:  #484f58;
    --accent: #58a6ff;
    --gold:   #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --green:  #3fb950;
    --red:    #f85149;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Malgun Gothic', sans-serif; }

  .seo-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; pointer-events: none; }

  /* 헤더 */
  .header { background: linear-gradient(135deg, #0d1117, #161b22); border-bottom: 1px solid var(--border); padding: 16px 20px 0; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header-title { display: flex; align-items: center; gap: 10px; }
  .header-title h1 { font-size: 1.2rem; font-weight: 700; }
  .header-meta { font-size: 0.72rem; color: var(--muted); }
  .tabs { display: flex; }
  .tab-btn { padding: 8px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--sub); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: color .15s, border-color .15s; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* 카드 그리드 */
  .dramas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px; }
  @media (max-width: 600px) { .dramas-grid { grid-template-columns: 1fr; } }

  /* 카드 */
  .drama-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .drama-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(88,166,255,.1); }
  .drama-card.rank-top { border-color: #2a2118; }
  .drama-card.rank-top:hover { border-color: var(--gold); box-shadow: 0 4px 20px rgba(255,215,0,.1); }

  /* 포스터 */
  .dc-poster { flex-shrink: 0; width: 80px; position: relative; overflow: hidden; background: #1c2128; }
  .dc-poster img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .dc-poster-ph { width: 100%; height: 100%; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 0.62rem; }
  .dc-poster-ph span { font-size: 1.4rem; }
  .dc-rank { position: absolute; top: 6px; left: 6px; width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 900; backdrop-filter: blur(4px); }
  .dc-rank.r1 { background: rgba(74,57,0,.88); color: var(--gold); border: 1px solid rgba(90,74,16,.8); }
  .dc-rank.r2 { background: rgba(42,47,53,.88); color: var(--silver); border: 1px solid rgba(58,69,80,.8); }
  .dc-rank.r3 { background: rgba(58,32,16,.88); color: var(--bronze); border: 1px solid rgba(90,48,32,.8); }
  .dc-rank.rn { background: rgba(13,17,23,.88); color: var(--sub); border: 1px solid rgba(33,38,45,.8); }

  /* 정보 영역 */
  .dc-info { flex: 1; min-width: 0; padding: 9px 10px 8px; display: flex; flex-direction: column; gap: 5px; }
  .dc-title-row { display: flex; align-items: center; gap: 5px; }
  .dc-title { font-size: 0.85rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }

  /* 채널·요일 배지 */
  .dc-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .dc-badge { font-size: 0.58rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
  .badge-sbs    { background: #0e2d56; color: #5ba3f5; }
  .badge-mbc    { background: #1a2e12; color: #6fcf6f; }
  .badge-kbs    { background: #2e1a1a; color: #f07070; }
  .badge-tvn    { background: #2a1040; color: #bc8cff; }
  .badge-jtbc   { background: #1a2633; color: #56aed9; }
  .badge-other  { background: #1c2128; color: var(--sub); }
  .badge-days   { background: #1c2128; color: var(--muted); }

  /* 시청률 바 */
  .dc-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .dc-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), #1f6feb); }
  .dc-bar-label { font-size: 0.6rem; color: var(--muted); margin-top: 1px; }

  /* 시청률 수치 */
  .dc-rating-row { display: flex; align-items: baseline; gap: 3px; }
  .dc-rating-val { font-size: 1rem; font-weight: 800; color: var(--accent); }
  .dc-rating-unit { font-size: 0.62rem; color: var(--muted); }

  .msg { padding: 50px; text-align: center; color: var(--muted); font-size: 0.9rem; }

  /* 필터 바 */
  .filter-bar { display: flex; gap: 5px; padding: 10px 14px 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg); }
  .filter-btn { padding: 3px 10px; background: transparent; border: 1px solid var(--border); border-radius: 20px; color: var(--sub); font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: #1f3a5a; border-color: var(--accent); color: var(--accent); }
  .filter-btn.airing-btn.active { background: #122d1c; border-color: var(--green); color: var(--green); }
  .filter-sep { width: 1px; background: var(--border); margin: 2px 2px; align-self: stretch; }

  /* 모달 */
  .modal-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.78); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; animation: modalIn .2s ease; }
  @keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(10px); } to { opacity:1; transform:none; } }

  .modal-header { display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border); }
  .modal-poster-wrap { flex-shrink: 0; width: 100px; border-radius: 8px; overflow: hidden; background: #1c2128; position: relative; }
  .modal-poster-wrap img { width: 100%; display: block; object-fit: cover; }
  .modal-poster-ph { width: 100%; height: 145px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 0.65rem; }
  .modal-poster-ph span { font-size: 1.8rem; }
  .modal-poster-wrap .dc-rank { top: 6px; left: 6px; }

  .modal-title-block { flex: 1; min-width: 0; padding-top: 2px; }
  .modal-drama-title { font-size: 1.08rem; font-weight: 700; line-height: 1.4; margin-bottom: 6px; word-break: keep-all; }
  .modal-badges-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .modal-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 4px; font-weight: 600; background: #1c2128; color: var(--sub); border: 1px solid var(--border); }
  .modal-rating-big { display: flex; align-items: baseline; gap: 4px; margin-bottom: 6px; }
  .modal-rating-num { font-size: 1.8rem; font-weight: 900; color: var(--accent); }
  .modal-rating-unit { font-size: 0.8rem; color: var(--muted); }
  .modal-bar-wrap .modal-bar-bg { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .modal-bar-wrap .modal-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #1f6feb); }

  .modal-close { flex-shrink: 0; align-self: flex-start; width: 28px; height: 28px; border-radius: 50%; background: #21262d; border: none; color: var(--sub); font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .modal-close:hover { background: #30363d; color: var(--text); }

  .modal-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .modal-section-title { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; }
  .modal-synopsis { font-size: 0.82rem; color: var(--sub); line-height: 1.65; word-break: keep-all; }
  .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-info-item { background: #1c2128; border-radius: 8px; padding: 9px 11px; }
  .modal-info-lbl { font-size: 0.6rem; color: var(--muted); margin-bottom: 3px; }
  .modal-info-val { font-size: 0.8rem; color: var(--text); font-weight: 600; line-height: 1.35; word-break: keep-all; }
  .modal-info-val.accent { color: var(--accent); }
</style>
</head>
<body>

<div id="seo-keywords" class="seo-hidden" aria-hidden="true"></div>

<div class="header">
  <div class="header-top">
    <div class="header-title">
      <span style="font-size:1.4rem">📺</span>
      <h1>드라마 시청률</h1>
    </div>
    <span class="header-meta" id="updated-time">-</span>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="drama">드라마</button>
    <button class="tab-btn"        data-tab="variety">예능</button>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn airing-btn active" data-filter="airing">방영중</button>
  <button class="filter-btn"                  data-filter="all">전체</button>
  <div class="filter-sep"></div>
  <button class="filter-btn" data-filter="월">월</button>
  <button class="filter-btn" data-filter="화">화</button>
  <button class="filter-btn" data-filter="수">수</button>
  <button class="filter-btn" data-filter="목">목</button>
  <button class="filter-btn" data-filter="금">금</button>
  <button class="filter-btn" data-filter="토">토</button>
  <button class="filter-btn" data-filter="일">일</button>
</div>

<div id="pane-drama"  class="tab-pane active"></div>
<div id="pane-variety" class="tab-pane"></div>

<!-- 모달 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div class="modal-poster-wrap" id="modal-poster"></div>
      <div class="modal-title-block">
        <div class="modal-drama-title" id="modal-title"></div>
        <div class="modal-badges-row"  id="modal-badges"></div>
        <div class="modal-rating-big"  id="modal-rating"></div>
        <div class="modal-bar-wrap"    id="modal-bar"></div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-synopsis-wrap"></div>
      <div>
        <div class="modal-section-title">드라마 정보</div>
        <div class="modal-info-grid" id="modal-info"></div>
      </div>
    </div>
  </div>
</div>

<script>
let _allItems   = [];   // 전체 목록 (모달 인덱스용)
let _dramaItems  = [];
let _varietyItems = [];
let _activeFilter = 'airing';  // 기본값: 방영중

async function loadData() {
  try {
    const r = await fetch('drama_data.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) { return null; }
}

function applyFilter(items) {
  if (_activeFilter === 'all')    return items;
  if (_activeFilter === 'airing') return items.filter(d => d.channel || d.air_days);
  // 요일 필터: air_days 에 해당 요일 글자 포함
  return items.filter(d => d.air_days && d.air_days.includes(_activeFilter));
}

// ── 유틸 ─────────────────────────────────────────────────────────────────────
function rankClass(r) { return r===1?'r1':r===2?'r2':r===3?'r3':'rn'; }

function channelBadge(ch) {
  const map = { SBS:'badge-sbs', MBC:'badge-mbc', KBS:'badge-kbs', KBS1:'badge-kbs', KBS2:'badge-kbs', tvN:'badge-tvn', JTBC:'badge-jtbc' };
  const cls = map[ch] || 'badge-other';
  return ch ? `<span class="dc-badge ${cls}">${ch}</span>` : '';
}

function daysBadge(days) {
  return days ? `<span class="dc-badge badge-days">${days}</span>` : '';
}

// ── 카드 ─────────────────────────────────────────────────────────────────────
function dramaCardHTML(d, maxRating, idx) {
  const rc = rankClass(d.rank);
  const isTop = d.rank <= 3;
  const barPct = maxRating > 0 ? (d.rating / maxRating * 100).toFixed(1) : 0;

  const posterHTML = d.poster_url
    ? `<img src="${d.poster_url}" alt="${d.title}" loading="lazy"
           onerror="this.parentElement.innerHTML='<div class=dc-poster-ph><span>📺</span>이미지없음</div>'">`
    : `<div class="dc-poster-ph"><span>📺</span>이미지없음</div>`;

  return `
  <div class="drama-card ${isTop?'rank-top':''}" onclick="openModal(${idx})">
    <div class="dc-poster">
      ${posterHTML}
      <div class="dc-rank ${rc}">${d.rank}</div>
    </div>
    <div class="dc-info">
      <div class="dc-title-row">
        <span class="dc-title" title="${d.title}">${d.title}</span>
      </div>
      <div class="dc-badges">
        ${channelBadge(d.channel)}${daysBadge(d.air_days)}
      </div>
      <div>
        <div class="dc-bar-bg"><div class="dc-bar-fill" style="width:${barPct}%"></div></div>
        <div class="dc-bar-label">시청률 ${d.rating}%</div>
      </div>
      <div class="dc-rating-row">
        <span class="dc-rating-val">${d.rating}</span>
        <span class="dc-rating-unit">%</span>
      </div>
    </div>
  </div>`;
}

// ── 모달 ─────────────────────────────────────────────────────────────────────
function openModal(idx) {
  const d = _allItems[idx]; if (!d) return;
  const rc = rankClass(d.rank);

  // 포스터
  document.getElementById('modal-poster').innerHTML =
    (d.poster_url
      ? `<img src="${d.poster_url}" alt="${d.title}"
             onerror="this.parentElement.innerHTML='<div class=modal-poster-ph><span>📺</span>이미지없음</div>'">`
      : `<div class="modal-poster-ph"><span>📺</span>이미지없음</div>`)
    + `<div class="dc-rank ${rc}">${d.rank}</div>`;

  // 제목
  document.getElementById('modal-title').textContent = d.title;

  // 배지
  document.getElementById('modal-badges').innerHTML =
    [channelBadge(d.channel), daysBadge(d.air_days)]
      .filter(Boolean)
      .join('') +
    (d.cast && d.cast.length ? `<span class="modal-badge">${d.cast.slice(0,2).join(', ')}</span>` : '');

  // 시청률
  document.getElementById('modal-rating').innerHTML =
    `<span class="modal-rating-num">${d.rating}</span><span class="modal-rating-unit">% 시청률</span>`;

  // 바
  document.getElementById('modal-bar').innerHTML = `
    <div class="modal-bar-bg"><div class="modal-bar-fill" style="width:${Math.min(d.rating*5,100)}%"></div></div>`;

  // 줄거리
  const synWrap = document.getElementById('modal-synopsis-wrap');
  synWrap.innerHTML = d.synopsis
    ? `<div><div class="modal-section-title">줄거리</div><div class="modal-synopsis">${d.synopsis}</div></div>`
    : '';

  // 드라마 정보
  const cast = (d.cast || []).join(', ') || '-';
  document.getElementById('modal-info').innerHTML = `
    <div class="modal-info-item" style="grid-column:1/-1">
      <div class="modal-info-lbl">출연</div>
      <div class="modal-info-val">${cast}</div>
    </div>
    <div class="modal-info-item">
      <div class="modal-info-lbl">채널</div>
      <div class="modal-info-val accent">${d.channel || '-'}</div>
    </div>
    <div class="modal-info-item">
      <div class="modal-info-lbl">방영 요일</div>
      <div class="modal-info-val">${d.air_days || '-'}</div>
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── SEO ───────────────────────────────────────────────────────────────────────
function injectSEO(data) {
  const now = new Date();
  const titles = [...(data.dramas||[]),...(data.variety||[])].map(d=>d.title).filter((v,i,a)=>a.indexOf(v)===i);
  const kws = [
    `${now.getMonth()+1}월 드라마 시청률 순위`,
    '이번주 드라마 시청률', '주간 드라마 순위', '드라마 시청률 TOP10',
    '월화드라마 시청률', '수목드라마 시청률', '금토드라마 시청률', '주말드라마 시청률',
    '예능 시청률 순위', '드라마 추천',
    ...titles.map(t=>`${t} 시청률`),
    ...(data.dramas||[]).slice(0,3).map(d=>`${d.title} ${d.rank}위 시청률`),
  ];
  document.getElementById('seo-keywords').textContent = kws.join(', ');
}

// ── 렌더 ─────────────────────────────────────────────────────────────────────
function renderList(filteredItems, paneId) {
  const pane = document.getElementById(paneId);
  if (!filteredItems || !filteredItems.length) {
    pane.innerHTML = '<div class="msg">해당 조건의 작품이 없습니다.</div>';
    return;
  }
  const maxRating = Math.max(...filteredItems.map(d => d.rating || 0));
  const cards = filteredItems.map(d => {
    const idx = _allItems.indexOf(d);   // 전체 목록 기준 인덱스 → 모달 정확성 보장
    return dramaCardHTML(d, maxRating, idx);
  }).join('');
  pane.innerHTML = `<div class="dramas-grid">${cards}</div>`;
}

function rerender() {
  renderList(applyFilter(_dramaItems),  'pane-drama');
  renderList(applyFilter(_varietyItems), 'pane-variety');
}

// 탭 전환
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pane-'+btn.dataset.tab).classList.add('active');
  });
});

// 필터 버튼
document.getElementById('filter-bar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  _activeFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  rerender();
});

async function init() {
  const data = await loadData();
  if (!data) {
    document.getElementById('pane-drama').innerHTML =
      '<div class="msg">drama_data.json 없음 — python drama_fetch.py 실행 필요</div>';
    return;
  }
  if (data.updated) {
    const d = new Date(data.updated);
    document.getElementById('updated-time').textContent =
      `업데이트 ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  // 종영 항목 제거
  _dramaItems   = (data.dramas  || []).filter(d => !d.is_ended);
  _varietyItems = (data.variety || []).filter(d => !d.is_ended);
  _allItems = [..._dramaItems, ..._varietyItems];
  rerender();   // 기본값 'airing' 필터 적용
  injectSEO(data);
}
init();
</script>
</body>
</html>
